---
type: specs.openrewrite.org/v1beta/recipe
name: com.amazonaws.java.migrate.MigrateAspectjMavenPlugin
displayName: Migrate org.codehaus.mojo aspectj-maven-plugin to dev.aspectj
description: >-
  Replace the unmaintained org.codehaus.mojo:aspectj-maven-plugin with its drop-in successor
  dev.aspectj:aspectj-maven-plugin and align the AspectJ runtime/tools. The codehaus plugin
  resolves com.sun:tools:jar (tools.jar), which was removed in JDK 9+, so any Maven build that
  binds it to the lifecycle fails with a PluginResolutionException once the toolchain is switched
  to Java 17/21/25 - even though compilation and the OpenRewrite recipes themselves succeed. The
  dev.aspectj fork is API/goal/configuration compatible and runs on JDK 9+. The plugin is pinned to
  1.14.1 and aspectjrt/aspectjtools to 1.9.25: the older 1.13.1 / 1.9.21 pair passes an invalid
  "-25" argument to AJC and fails to compile on Java 25 ("unrecognized single argument: -25"),
  whereas 1.14.1 / 1.9.25 compiles cleanly on Java 17, 21 and 25 (and still raises the AspectJ
  floor for projects that pin the runtime below 1.9.7). This is a Maven-only migration (no-op on
  Gradle projects and on projects that do not use the plugin), and is target-JDK driven, so it
  applies to every Java 17/21/25 upgrade regardless of source version.
tags:
  - java17
  - java21
  - java25
  - aspectj
recipeList:
  - org.openrewrite.maven.ChangePluginGroupIdAndArtifactId:
      oldGroupId: org.codehaus.mojo
      oldArtifactId: aspectj-maven-plugin
      newGroupId: dev.aspectj
      newArtifactId: aspectj-maven-plugin
      newVersion: 1.14.1
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.aspectj
      artifactId: aspectj*
      newVersion: 1.9.25
---
type: specs.openrewrite.org/v1beta/recipe
name: com.amazonaws.java.migrate.UpgradeToJava17
displayName: Migrate to Java 17
description: >-
  Migrate to Java 17. Delegates to the official, validated OpenRewrite recipe
  org.openrewrite.java.migrate.UpgradeToJava17 (cumulative from Java 8/11) so the recipe list
  stays correct and current with the resolved rewrite-migrate-java version rather than being a
  hand-maintained copy that drifts. The official recipe already includes the J2EE dependency
  additions, deprecated-API replacements, build/plugin upgrades, and the guice/commons-codec/
  spotbugs/mapstruct/lombok dependency bumps. StringFormatted is appended to preserve prior
  toolkit behavior (the official recipe does not include it). MigrateAspectjMavenPlugin is
  appended to fix the org.codehaus.mojo aspectj-maven-plugin tools.jar failure on JDK 9+.
  ChangePropertyValue bumps the non-standard "java-version" Maven property (common in legacy
  Spring template poms) to the target. The official recipe only recognises java.version and
  maven.compiler.*, so a custom java-version stays at its old value and, once source/target are
  folded into <release>, feeds javac a dotted "--release 1.8" that it rejects on every JDK. It
  runs only when the property already exists (addIfMissing:false), so it is a no-op elsewhere.
tags:
  - java17
recipeList:
  - org.openrewrite.maven.ChangePropertyValue:
      key: java-version
      newValue: "17"
      addIfMissing: false
  - org.openrewrite.java.migrate.UpgradeToJava17
  - org.openrewrite.java.migrate.lang.StringFormatted:
      addParentheses: false
  - com.amazonaws.java.migrate.MigrateAspectjMavenPlugin
---
